<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,viewport-fit=cover">
<title>⚡ 案件衝刺排行</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}

/* ══ 核心：字體跟著視窗縮放，320px~2560px 全自動 ══ */
html{font-size:clamp(11px,1.2vw+4px,18px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{width:100%;min-height:100vh;font-family:'Segoe UI',sans-serif;
  background:linear-gradient(160deg,#0d0830 0%,#0d0d1f 40%,#0b1a0e 100%);
  background-attachment:fixed;color:#eee;overflow-x:hidden;
  padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{max-width:100%}
:root{--bg:#0d0d1f;--gold:#ffd700;--ora:#f7971e;--txt:#eee;--mut:#9988bb;--red:#ff4466;--grn:#44ffaa;--border:rgba(255,255,255,.1)}

/* ══ SCREENS ══ */
#titleScreen{display:block;min-height:100vh}
#gameScreen{display:none;min-height:100vh}
#gameScreen.on{display:block}

/* ══ LOADING ══ */
#loadingOverlay{position:fixed;inset:0;background:rgba(6,3,24,.92);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1em}
.spinner{width:3em;height:3em;border:.3em solid rgba(255,215,0,.2);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes auroraRot{to{transform:rotate(360deg)}}
@keyframes borderFlow{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}
@keyframes ringSpin{to{transform:rotate(360deg)}}
@keyframes warriorPulse{from{letter-spacing:2px;opacity:.9}to{letter-spacing:6px;opacity:1}}

/* ══ TITLE ══ */
.tglow{font-size:clamp(1.8em,5vw,3.2em);font-weight:900;background:linear-gradient(135deg,#f7971e,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;padding:clamp(1.5em,4vw,2.5em) 1em .3em}
.tsub{text-align:center;color:var(--mut);letter-spacing:.2em;font-size:clamp(.7em,1.5vw,.85em);margin-bottom:1.5em;text-transform:uppercase}
.rpanel{max-width:min(520px,94vw);margin:0 auto;padding:0 clamp(.6em,3vw,1em) 2.5em}
.box{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:1em;padding:clamp(.9em,2.5vw,1.4em);margin-bottom:.9em}
.box h3{color:var(--ora);font-size:.9em;font-weight:700;margin-bottom:1em}
.fl{display:block;font-size:.72em;color:var(--mut);margin-bottom:.3em;text-transform:uppercase;letter-spacing:.08em}
.fi{width:100%;padding:.65em .8em;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:.6em;color:#eee;font-size:1rem;outline:none;-webkit-user-select:text;user-select:text}
.fi:focus{border-color:var(--ora)}
.fgroup{margin-bottom:.75em}

/* ══ AVATAR ══ */
.avatar-wrap{display:flex;flex-direction:column;align-items:center;gap:.5em;margin-bottom:.9em}
.avatar-preview{width:clamp(56px,12vw,80px);height:clamp(56px,12vw,80px);border-radius:50%;border:3px solid var(--ora);background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:1.8em;cursor:pointer;overflow:hidden}
.avatar-preview img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.avatar-label{font-size:.72em;color:var(--mut)}

/* ══ BUTTONS ══ */
.btn{padding:.65em 1.4em;border:none;border-radius:2em;font-size:.88em;font-weight:700;cursor:pointer;transition:all .2s;touch-action:manipulation;min-height:2.5em;-webkit-tap-highlight-color:transparent}
.bm{background:linear-gradient(135deg,var(--ora),var(--gold));color:#1a0a00}
.bm:hover{filter:brightness(1.1);transform:translateY(-1px)}
.bg{background:rgba(255,255,255,.08);color:#eee;border:1px solid rgba(255,255,255,.15)}
.bg:hover{background:rgba(255,255,255,.14)}
.bsm{padding:.4em .9em;font-size:.78em;min-height:2.1em}
.bdel{background:linear-gradient(135deg,#c0392b,#922b21);color:#fff}

/* ══ TOPBAR ══ */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:.55em clamp(.5em,2vw,.9em);background:rgba(0,0,0,.5);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:.4em;position:sticky;top:0;z-index:50}
.pbadge{display:flex;align-items:center;gap:.45em;background:rgba(255,255,255,.07);padding:.3em .75em;border-radius:1.5em;cursor:pointer;font-size:.85em;-webkit-tap-highlight-color:transparent}
.pbadge-avatar{width:1.8em;height:1.8em;border-radius:50%;border:2px solid var(--ora);background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:.9em;flex-shrink:0;overflow:hidden}
.pbadge-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.tabs{display:flex;gap:.32em;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none;max-width:calc(100vw - 8em)}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:.38em .8em;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:1.4em;cursor:pointer;font-size:.76em;white-space:nowrap;flex-shrink:0;-webkit-tap-highlight-color:transparent;transition:all .18s}
.tab.on{background:linear-gradient(135deg,var(--ora),var(--gold));color:#1a0a00;border-color:transparent;font-weight:700}
.fb-status{display:inline-flex;align-items:center;gap:.3em;font-size:.72em;color:var(--mut);padding:.2em .5em;border-radius:.6em;background:rgba(255,255,255,.05)}
.fb-dot{width:.45em;height:.45em;border-radius:50%;background:var(--mut);flex-shrink:0;transition:background .3s}
.fb-dot.online{background:var(--grn);box-shadow:0 0 6px var(--grn)}
.fb-dot.offline{background:var(--red)}

/* ══ MAIN ══ */
.main{padding:clamp(.6em,2vw,1.25em) clamp(.6em,2.5vw,1em);max-width:min(960px,100%);margin:0 auto}
.pane{display:none}.pane.on{display:block}
.sec-title{color:var(--ora);font-size:.95em;font-weight:700;margin-bottom:.9em}

/* ══ KING BANNER ══ */
.king-banner{position:relative;border-radius:1.5em;overflow:hidden;margin-bottom:1.5em;
  min-height:clamp(12em,35vw,22em);background:#060318;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:clamp(1.2em,3vw,2.2em) clamp(.8em,2.5vw,1.5em) clamp(1em,2.5vw,1.8em);
  text-align:center;gap:clamp(.5em,1.5vw,.8em);
  box-shadow:0 0 0 1.5px rgba(255,215,0,.35),0 0 2.5em rgba(255,215,0,.12),0 0 5em rgba(130,60,255,.15),0 1.2em 3.5em rgba(0,0,0,.5)}
.king-banner::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(255,215,0,.18) 0%,transparent 55%),radial-gradient(ellipse at 15% 100%,rgba(130,60,255,.18) 0%,transparent 50%),radial-gradient(ellipse at 85% 100%,rgba(0,200,255,.14) 0%,transparent 50%);pointer-events:none}
.king-banner::after{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(90deg,rgba(255,215,0,0) 0%,rgba(255,215,0,.25) 20%,rgba(180,80,255,.2) 40%,rgba(0,200,255,.2) 60%,rgba(255,100,180,.18) 80%,rgba(255,215,0,0) 100%) border-box;-webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);-webkit-mask-composite:destination-out;mask-composite:exclude;animation:borderFlow 4s linear infinite;pointer-events:none}
.king-avatar-ring{position:relative;display:inline-block}
.king-avatar-ring::before{content:'';position:absolute;inset:-.9em;border-radius:50%;background:conic-gradient(from 0deg,#ffd700,#e040fb,#00bcd4,#ffd700);animation:ringSpin 3s linear infinite;filter:blur(.2em);opacity:.8}
.king-avatar-ring::after{content:'';position:absolute;inset:-.5em;border-radius:50%;background:conic-gradient(from 180deg,#ffd700,transparent,#ffd700);animation:ringSpin 2s linear infinite reverse}
.king-avatar{width:clamp(4.5em,12vw,7.5em);height:clamp(4.5em,12vw,7.5em);border-radius:50%;border:4px solid #fff;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;z-index:2;box-shadow:0 0 0 4px rgba(255,215,0,.4),0 0 1.8em rgba(255,215,0,.3);background:#1a0a3a}
.king-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.king-crown{font-size:clamp(1.4em,4vw,2.4em);filter:drop-shadow(0 0 .75em rgba(255,215,0,.8));animation:float 3s ease-in-out infinite}
.king-name{font-size:clamp(1.1em,3.5vw,2em);font-weight:900;background:linear-gradient(135deg,#ffe066 0%,#fff 40%,#ffd700 60%,#ffb700 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 1em rgba(255,215,0,.7));letter-spacing:.06em;text-transform:uppercase}
.king-score{font-size:clamp(.7em,1.5vw,.95em);color:rgba(255,255,255,.8)}
.king-badges{display:flex;gap:.4em;flex-wrap:wrap;justify-content:center}
.star-bg{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.aurora{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.aurora::before{content:'';position:absolute;width:200%;height:200%;top:-50%;left:-50%;background:conic-gradient(from 0deg at 50% 50%,rgba(255,215,0,0) 0%,rgba(130,60,255,.08) 15%,rgba(0,180,255,.1) 30%,rgba(255,215,0,.08) 45%,rgba(255,60,130,.07) 60%,rgba(130,60,255,.08) 75%,rgba(0,180,255,.06) 90%,rgba(255,215,0,0) 100%);animation:auroraRot 18s linear infinite}

/* ══ TITLES ROW ══ */
#titlesRow{display:flex;gap:clamp(.5em,1.5vw,.75em);margin-bottom:1.4em;flex-wrap:wrap}
#titlesRow>div{flex:1;min-width:clamp(5em,18vw,7.5em);border-radius:1em;padding:clamp(.6em,1.5vw,.9em) clamp(.5em,1.2vw,.75em);text-align:center;position:relative;overflow:hidden;transition:transform .2s}

/* ══ PLAYERS GRID ══ */
.players-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(10em,44vw),1fr));gap:clamp(.6em,1.5vw,.9em);margin-bottom:1.5em}
.player-card{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:1em;padding:clamp(.65em,1.8vw,1em);text-align:center;transition:all .25s;-webkit-tap-highlight-color:transparent}
.player-card:hover{border-color:rgba(247,151,30,.5);transform:translateY(-2px)}
.pc-prog-wrap{margin:.5em 0 .25em;height:6px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
.pc-prog-fill{height:100%;border-radius:3px;transition:width 1s}

/* ══ INPUT GRID ══ */
.input-grid,.irow{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:clamp(.4em,1.2vw,.6em);
  margin-bottom:clamp(.4em,1.2vw,.6em);
}
.ibox{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:.6em;padding:clamp(.45em,1.5vw,.65em);min-width:0}
.ibox label{display:block;font-size:.68em;color:var(--mut);margin-bottom:.3em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wh{font-size:.82em;color:var(--ora)}
.numctrl{display:flex;border:1px solid rgba(255,255,255,.18);border-radius:.45em;overflow:hidden;width:100%}
.numctrl button{background:rgba(255,255,255,.1);border:none;color:#eee;font-weight:700;
  width:clamp(1.8em,8vw,2.4em);min-height:2.2em;
  font-size:clamp(.9em,3.5vw,1.25em);
  cursor:pointer;touch-action:manipulation;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  -webkit-tap-highlight-color:transparent}
.numctrl button:active{background:rgba(247,151,30,.4);color:var(--ora)}
.numctrl input{
  flex:1;min-width:0;
  background:rgba(255,255,255,.06);
  border:none;
  border-left:1px solid rgba(255,255,255,.12);
  border-right:1px solid rgba(255,255,255,.12);
  color:#eee;
  font-size:max(1em,16px) !important;
  font-weight:700;text-align:center;
  padding:0;min-height:2.2em;outline:none;
  -webkit-appearance:none;appearance:none;
  -webkit-user-select:text;user-select:text;touch-action:manipulation;width:100%}
.numctrl input:focus{background:rgba(247,151,30,.12)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.daily-wrap{max-width:min(560px,100%)}
.leave-row{display:none}

/* ══ STATS ══ */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(15em,90vw),1fr));gap:clamp(.6em,1.5vw,.85em)}
.scard{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:.95em;padding:clamp(.75em,1.8vw,1em);cursor:pointer;transition:border-color .2s}
.scard:hover{border-color:rgba(247,151,30,.4)}
.scard-header{display:flex;align-items:center;gap:.7em;margin-bottom:.75em}
.brow{display:flex;align-items:center;gap:.45em;margin-bottom:.32em}
.bl{width:2.4em;font-size:.7em;color:var(--mut);text-align:right;flex-shrink:0}
.bbar{flex:1;height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden}
.bval{width:2em;font-size:.7em;color:var(--ora);text-align:right;flex-shrink:0}
.progbar{height:5px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;margin:.32em 0 .2em}
.progfill{height:100%;border-radius:3px;transition:width .8s}

/* ══ LEADERBOARD ══ */
.lbw{max-width:min(680px,100%)}
.lbr{display:flex;align-items:center;gap:clamp(.45em,1.2vw,.7em);padding:clamp(.55em,1.5vw,.7em) clamp(.6em,1.8vw,.9em);background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);border-radius:.75em;margin-bottom:.45em}
.lbrank{width:1.75em;height:1.75em;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8em;background:rgba(255,255,255,.08);flex-shrink:0}

/* ══ TITLES ══ */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(10.5em,44vw),1fr));gap:clamp(.55em,1.5vw,.7em)}
.tcard{background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:.85em;padding:clamp(.85em,2vw,1.1em);text-align:center}

/* ══ VOTE ══ */
#voteGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(10em,44vw),1fr));gap:clamp(.6em,1.5vw,.9em)}

/* ══ MODAL BASE ══ */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:650;display:none;align-items:center;justify-content:center;padding:1em}
.modal-ov.on{display:flex}
.modal-bx{background:#13132a;border:1px solid rgba(255,255,255,.13);border-radius:1.1em;padding:clamp(1em,3vw,1.6em);max-width:min(340px,94vw);width:100%}
.prof-av{width:5.25em;height:5.25em;border-radius:50%;border:3px solid var(--ora);background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:2em;cursor:pointer;overflow:hidden;margin:0 auto .5em}
.prof-av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
#pm{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:600;display:none;align-items:center;justify-content:center;padding:1em}
#pm.on{display:flex}
.pmb{background:#13132a;border:1px solid rgba(255,255,255,.13);border-radius:1.1em;padding:clamp(.9em,3vw,1.5em);text-align:center;max-width:min(300px,92vw);width:100%}
#pm-av{width:3.75em;height:3.75em;border-radius:50%;border:3px solid var(--gold);background:rgba(255,255,255,.1);margin:0 auto .65em;display:flex;align-items:center;justify-content:center;font-size:1.6em;overflow:hidden}
#pm-av img{width:100%;height:100%;object-fit:cover;border-radius:50%}
#deleteModal{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:700;display:none;align-items:center;justify-content:center;padding:1em}
#deleteModal.on{display:flex}

/* ══ WARRIOR ══ */
#warriorOverlay{position:fixed;inset:0;z-index:1000;pointer-events:none;display:none}
#warriorOverlay canvas{position:absolute;inset:0;width:100%;height:100%}
.warrior-text{position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);text-align:center;pointer-events:none;width:90vw}
.warrior-title-big{font-size:clamp(1.8em,6vw,4em);font-weight:900;background:linear-gradient(135deg,#ffd700 0%,#fff 40%,#e040fb 70%,#00bcd4 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 1.8em rgba(255,215,0,.8));animation:warriorPulse 1.2s ease-in-out infinite alternate;white-space:nowrap}
.warrior-sub{font-size:clamp(.9em,2.5vw,1.5em);color:rgba(255,255,255,.9);margin-top:.5em;animation:float 2s ease-in-out infinite}

/* ══ MISC ══ */
#sc{position:fixed;inset:0;pointer-events:none;z-index:800;display:none}
#sparkleCanvas{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55}
.lt{width:100%;border-collapse:collapse;font-size:.82em}
.lt th{color:var(--mut);text-align:left;padding:.35em .5em;border-bottom:1px solid rgba(255,255,255,.08)}
.lt td{padding:.38em .5em;border-bottom:1px solid rgba(255,255,255,.04)}
.toast{position:fixed;bottom:max(1.25em,env(safe-area-inset-bottom,1.25em));left:50%;transform:translateX(-50%);background:rgba(14,14,35,.96);border:1px solid rgba(255,255,255,.15);border-radius:.8em;padding:.65em 1.25em;font-size:.87em;z-index:9999;display:none;white-space:nowrap;max-width:90vw;text-align:center}
::-webkit-scrollbar{width:.25em;height:.25em}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:.15em}
#deleteModal.on{display:flex!important}

/* ══ 達標彈彈堂發光特效 ══ */
@keyframes bbGlow{
  0%{box-shadow:0 0 .4em rgba(100,220,255,.8),0 0 1em rgba(100,220,255,.5),0 0 2em rgba(80,180,255,.3),0 0 4em rgba(60,140,255,.15),inset 0 0 .5em rgba(100,220,255,.12)}
  40%{box-shadow:0 0 .6em rgba(255,230,80,.9),0 0 1.5em rgba(255,200,50,.6),0 0 3em rgba(255,160,0,.35),0 0 6em rgba(255,120,0,.18),inset 0 0 .8em rgba(255,200,80,.15)}
  70%{box-shadow:0 0 .5em rgba(180,100,255,.9),0 0 1.2em rgba(160,80,255,.6),0 0 2.5em rgba(130,60,255,.3),0 0 5em rgba(100,40,255,.15),inset 0 0 .6em rgba(160,80,255,.12)}
  100%{box-shadow:0 0 .4em rgba(100,220,255,.8),0 0 1em rgba(100,220,255,.5),0 0 2em rgba(80,180,255,.3),0 0 4em rgba(60,140,255,.15),inset 0 0 .5em rgba(100,220,255,.12)}
}
@keyframes bbBorder{
  0%{border-color:rgba(100,220,255,.7)}
  40%{border-color:rgba(255,210,60,.9)}
  70%{border-color:rgba(180,100,255,.8)}
  100%{border-color:rgba(100,220,255,.7)}
}
@keyframes bbSweep{
  0%{transform:translateX(-120%) skewX(-15deg)}
  100%{transform:translateX(250%) skewX(-15deg)}
}
@keyframes bbStar{
  0%,100%{opacity:0;transform:scale(0) rotate(0deg)}
  30%,70%{opacity:1;transform:scale(1) rotate(180deg)}
}
.scard.achieved{
  animation:bbGlow 2.4s ease-in-out infinite, bbBorder 2.4s ease-in-out infinite;
  border-width:2px!important;
  background:radial-gradient(ellipse at 50% 0%,rgba(100,200,255,.08),rgba(255,255,255,.02) 70%)!important;
  position:relative;overflow:hidden;
}
.scard.achieved::before{
  content:'';position:absolute;top:0;left:0;width:45%;height:100%;
  background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.06) 30%,rgba(255,255,255,.18) 50%,rgba(255,255,255,.06) 70%,transparent 100%);
  animation:bbSweep 2.4s ease-in-out infinite;pointer-events:none;z-index:1;border-radius:inherit;
}
.scard.achieved::after{
  content:'★';position:absolute;top:.3em;right:.35em;font-size:.9em;
  background:linear-gradient(135deg,#ffe066,#ffaa00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 .3em rgba(255,200,0,.9)) drop-shadow(0 0 .6em rgba(255,160,0,.6));
  animation:bbStar 2.4s ease-in-out infinite;z-index:2;
}

/* ══ 每日全員統計面板 ══ */
.daily-stats-panel{position:relative;border-radius:1.2em;padding:clamp(.8em,2vw,1.2em) clamp(.8em,2vw,1.4em);background:linear-gradient(135deg,#0d0820,#150a30,#0a1a10);overflow:hidden}

.daily-stats-panel::after{content:'';position:absolute;inset:2px;border-radius:calc(1.2em - 2px);background:linear-gradient(135deg,#0d0820,#150a30,#0a1a10);z-index:0;pointer-events:none}

<script>
// ════════════════════════════════════════════
// FIREBASE CONFIG
// ════════════════════════════════════════════
const firebaseConfig = {
  apiKey: "AIzaSyAdr_4vgKeV3-M5fE3uMJ-MQSUTScRIefc",
  authDomain: "case-sprint-13143.firebaseapp.com",
  databaseURL: "https://case-sprint-13143-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "case-sprint-13143",
  storageBucket: "case-sprint-13143.firebasestorage.app",
  messagingSenderId: "452472106582",
  appId: "1:452472106582:web:a629ef41927ee1196115f7"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ════════════════════════════════════════════
// CONSTANTS & VARIABLES
// ════════════════════════════════════════════
let me = null;
let players = {};
let sparks = [];
let animTime = 0; // 用於取代原本未宣告的 t 變數，控制旋轉

// 動畫邏輯主循環與繪圖修正
const canvas = document.getElementById('sparkleCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function animate() {
  animTime++;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 火花特效繪製
  for(let i = sparks.length - 1; i >= 0; i--) {
    const p = sparks[i];
    p.x += p.vx; p.y += p.vy; p.vy += .25; p.vx *= .98; p.life -= p.decay;
    if(p.life <= 0) { sparks.splice(i, 1); continue; }
    const [rc, gc, bc] = p.col;
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    
    if(p.star) {
      ctx.translate(p.x, p.y);
      ctx.rotate(animTime * p.rotSpeed);
      ctx.fillStyle = `rgb(${rc},${gc},${bc})`;
      ctx.shadowBlur = 10;
      ctx.shadowColor = `rgb(${rc},${gc},${bc})`;
      
      // ══ 修正：補齊原本被切斷的五角星繪製路徑 ══
      ctx.beginPath();
      for(let j = 0; j < 5; j++) {
        const alpha = (j / 5) * Math.PI * 2 - Math.PI / 2;
        ctx.lineTo(Math.cos(alpha) * p.size, Math.sin(alpha) * p.size);
        const beta = alpha + Math.PI / 5;
        ctx.lineTo(Math.cos(beta) * (p.size * 0.4), Math.sin(beta) * (p.size * 0.4));
      }
      ctx.closePath();
      ctx.fill();
    } else {
      let g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size || 5);
      g.addColorStop(0, `rgba(${rc},${gc},${bc},1)`);
      g.addColorStop(1, `rgba(${rc},${gc},${bc},0)`);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size || 5, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();
    }
    ctx.restore();
  }
  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// 模擬基礎功能，防止其他未定義報錯
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2000);
}
function doLogout() {
  me = null; sessionStorage.removeItem('me');
  document.getElementById('gameScreen').classList.remove('on');
  document.getElementById('titleScreen').style.display = 'block';
}
function doLogin() {
  const emp = document.getElementById('lEmp').value.trim();
  if(!emp) { showToast('請輸入員編'); return; }
  document.getElementById('loadingOverlay').style.display = 'none';
  document.getElementById('titleScreen').style.display = 'none';
  document.getElementById('gameScreen').classList.add('on');
}
function doReg() {
  const emp = document.getElementById('rEmp').value.trim();
  const name = document.getElementById('rName').value.trim();
  if(!emp || !name) { showToast('請填寫完整欄位'); return; }
  document.getElementById('titleScreen').style.display = 'none';
  document.getElementById('gameScreen').classList.add('on');
}
function switchTab(tabId) {
  showToast('切換至分頁: ' + tabId);
}
function handleAvatarUpload(e, type) {
  showToast('頭貼上傳模擬');
}
